<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Профиль - MyDrop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-purple-900 text-white font-sans min-h-screen p-6">
  <a href="/" class="text-yellow-400 underline mb-4 inline-block">← На главную</a>
  <h1 class="text-3xl font-bold mb-6">Профиль</h1>
  <div id="profileInfo" class="mb-6"></div>
  <h2 class="text-2xl font-semibold mb-4">Лучший дроп</h2>
  <div id="bestItem" class="mb-8"></div>
  <h2 class="text-2xl font-semibold mb-4">Инвентарь</h2>
  <div id="inventory" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
  <button id="logout" class="mt-8 bg-red-500 px-4 py-2 rounded hover:bg-red-600">Выйти из аккаунта</button>
  <script>
    const data = JSON.parse(localStorage.getItem('mydrop_user'));
    if (!data || !data.username) {
      document.body.innerHTML = '<p class="text-xl">Пожалуйста, <a class="underline text-yellow-400" href="/">войдите в аккаунт</a>.</p>';
    } else {
      document.getElementById('profileInfo').innerHTML = `
        <p><strong>Ник:</strong> ${data.username}</p>
        <p><strong>Баланс:</strong> ${data.balance}₽</p>
      `;
      const inventory = data.inventory || [];
      const inventoryContainer = document.getElementById('inventory');
      if (inventory.length === 0) {
        inventoryContainer.innerHTML = '<p>Инвентарь пуст.</p>';
      } else {
        inventory.forEach(item => {
          const card = document.createElement('div');
          card.className = 'bg-purple-800 p-4 rounded shadow text-center';
          card.innerHTML = `
            <img src="${item.img}" alt="${item.name}" class="w-full h-32 object-contain mb-2" />
            <p>${item.name}</p>
          `;
          inventoryContainer.appendChild(card);
        });
        const best = inventory.reduce((max, item) => item.price > max.price ? item : max, inventory[0]);
        document.getElementById('bestItem').innerHTML = `
          <div class="bg-green-600 p-4 rounded shadow text-center w-64">
            <img src="${best.img}" alt="${best.name}" class="w-full h-32 object-contain mb-2" />
            <p class="text-lg font-bold">${best.name}</p>
            <p class="text-yellow-300">Цена: ${best.price}₽</p>
          </div>
        `;
      }
    }
    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('mydrop_user');
      window.location.href = '/';
    });
  </script>
</body>
</html>
